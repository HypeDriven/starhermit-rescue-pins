<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rescue Pins</title>
<meta name="description" content="Pull pins in sequence to route water, isolate lava, and rescue the villagers.">
<style>
  :root {
    --bg: #14171d; --panel: #1f242e; --fg: #e8ecf2; --dim: #9aa4b2;
    --accent: #7fe0a8; --danger: #ff6b5e; --btn: #2a3140; --btn-hi: #3a4356;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, sans-serif; }
  body.big-text { font-size: 20px; }
  body.hc { --bg: #000; --panel: #111; --fg: #fff; --dim: #ccc; --accent: #00ff88; --btn: #222; --btn-hi: #444; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #app, .rp-root { height: 100%; display: flex; flex-direction: column; }
  .rp-shell { flex: 1; display: grid; grid-template-columns: 240px 1fr 240px; min-height: 0;
    padding: var(--sat) var(--sar) 0 var(--sal); }
  .rp-rail { padding: 12px; overflow-y: auto; background: var(--panel); }
  .rp-rail-title { font-size: 1rem; margin: 0 0 8px; }
  .rp-stage { position: relative; min-width: 0; }
  .rp-canvas-host { position: absolute; inset: 0; overflow: hidden; }
  .rp-canvas-host canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .rp-tray { display: flex; gap: 8px; justify-content: center; padding: 8px;
    padding-bottom: calc(8px + var(--sab)); background: var(--panel); flex-wrap: wrap; }
  .rp-btn { min-height: 44px; min-width: 44px; padding: 10px 16px; margin: 4px;
    background: var(--btn); color: var(--fg); border: 2px solid transparent; border-radius: 10px;
    font: inherit; cursor: pointer; }
  .rp-btn:hover { background: var(--btn-hi); }
  .rp-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .rp-btn-primary { background: var(--accent); color: #10241a; font-weight: 700; }
  .rp-btn-quiet { background: transparent; border-color: var(--dim); }
  .rp-btn-danger { background: var(--danger); color: #2a0c08; }
  .rp-btn-mode { display: block; width: 100%; text-align: left; }
  .rp-overlay { position: fixed; inset: 0; background: rgba(10,12,16,.72);
    display: flex; align-items: center; justify-content: center; z-index: 10; overflow-y: auto; }
  .rp-overlay[hidden] { display: none; }
  .rp-panel { background: var(--panel); border-radius: 14px; padding: 20px; max-width: 70ch;
    width: min(92vw, 640px); max-height: 90vh; overflow-y: auto; }
  .rp-panel h1 { margin: 0 0 4px; }
  .rp-tag, .rp-dim { color: var(--dim); }
  .rp-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .rp-stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin: 10px 0; }
  .rp-stage-done { border-color: var(--accent); }
  .rp-score-list { list-style: none; padding: 0; }
  .rp-total { font-weight: 700; margin-top: 6px; }
  .rp-win { color: var(--accent); } .rp-lose { color: var(--danger); }
  .rp-settings-sections { display: grid; gap: 8px; }
  .rp-settings-section { border: 1px solid var(--btn-hi); border-radius: 10px; padding: 8px 12px; }
  .rp-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .rp-field input[type=range] { flex: 1; max-width: 200px; min-height: 44px; }
  .rp-pin-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .rp-pin-opt.rp-selected { border-color: var(--accent); background: var(--btn-hi); }
  .rp-rule-cards { display: grid; gap: 8px; }
  .rp-rule-card { background: var(--btn); border-radius: 10px; padding: 10px 14px; }
  .rp-rule-card h3 { margin: 0 0 4px; }
  .rp-webgl-fallback { position: absolute; inset: auto 0 0 0; background: var(--danger); color: #000;
    padding: 12px; font-weight: 600; }
  .rp-hint { color: var(--accent); }
  .rp-countdown h2 { font-size: 3rem; text-align: center; }
  /* compact desktop/tablet: rails collapse */
  @media (max-width: 1023px) {
    .rp-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .rp-rail { max-height: 22vh; }
    .rp-rail-left { order: 0; } .rp-stage { order: 1; min-height: 40vh; } .rp-rail-right { order: 2; }
  }
  /* portrait mobile: bottom thumb-zone tray */
  @media (max-width: 640px) and (orientation: portrait) {
    .rp-tray { position: sticky; bottom: 0; }
  }
  /* landscape mobile: narrow status rail */
  @media (max-height: 480px) and (orientation: landscape) {
    .rp-shell { grid-template-columns: 160px 1fr; grid-template-rows: 1fr; }
    .rp-rail-right { display: none; }
  }
</style>
</head>
<body>
<header class="sr-only"><h1>Rescue Pins</h1></header>
<main id="app"></main>
<noscript><p>Rescue Pins needs JavaScript (ES modules) to run. All assets are local; no network is required to play.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
